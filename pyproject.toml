[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chartqa-dt"
version = "0.1.0"
description = "Dual-Target Grounded-Execute ChartQA: grounded evidence, typed plans, deterministic execution."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Ahmed" }]

# Core dependencies are deliberately light and CPU-only so that the executor,
# metrics, plan mining, coordinate maths and synthetic generator can be
# developed and tested on any machine, including CI, with no GPU stack.
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "jsonschema>=4.20",
    "huggingface-hub>=0.26",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
# Needed to run the OFFICIAL evaluators (decision 0003). torch here is the CPU
# wheel; the GPU wheel comes from the host image on Kaggle/Colab.
eval = [
    "torch>=2.4",
    "torchmetrics[detection]>=1.4",
    "datasets>=3.0",
]
# The training stack. Installed on the GPU host, not in CI.
# transformers>=4.57 is a hard floor: Qwen3-VL's config declares
# transformers_version 4.57.0.dev0 and earlier releases cannot load model_type
# "qwen3_vl" at all.
gpu = [
    "transformers>=4.57.0",
    "peft>=0.14.0",
    "trl>=0.12.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",
    "sentencepiece>=0.2.0",
    "wandb>=0.18.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]
demo = ["gradio>=4.44"]

[project.scripts]
cdt-data   = "chartqa_dt.cli.data:main"
cdt-gen    = "chartqa_dt.cli.generate:main"
cdt-mine   = "chartqa_dt.cli.mine_plans:main"
cdt-train  = "chartqa_dt.cli.train:main"
cdt-eval   = "chartqa_dt.cli.evaluate:main"
cdt-report = "chartqa_dt.cli.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chartqa_dt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds",
    "gpu: requires a CUDA device",
    "network: requires network access",
    "official: requires the official evaluator stack (torch + torchmetrics + datasets)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Vendored third-party evaluators must stay byte-identical to upstream
# (decision 0003), so they are never linted or formatted.
extend-exclude = [
    "verification/",
    "src/chartqa_dt/eval/official/vendor/",
    ".venv/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B905",    # zip() strict= is not always wanted
    "RUF001",  # ambiguous unicode in prose/docstrings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]
