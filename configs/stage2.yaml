_base_: base.yaml
run_name: stage2

model:
  max_seq_len: 1536

train:
  stage: stage2
  lr: 5.0e-5
  epochs: 1.0
  per_device_batch: 2
  grad_accum: 4
  optim: adamw_fused
  lr_scheduler: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  save_every_steps: 100
  eval_every_steps: 250
  metric_every_steps: 1000
  metric_batch_size: 8
