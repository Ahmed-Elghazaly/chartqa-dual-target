# Primary backbone (IDEA.md 7). Apache-2.0, native 0-1000 box coordinates.
# NOTE (decision 0008): patch_size is 16 and merge_size is 2 for Qwen3-VL, so
# one visual token covers 32x32 px, NOT the 28x28 stated in IDEA.md/PLAN.md.
# The factor is derived from the loaded processor, never hard-coded.
_base_: base.yaml

model:
  hf_id: Qwen/Qwen3-VL-2B-Instruct
  hf_id_4bit: unsloth/Qwen3-VL-2B-Instruct-unsloth-bnb-4bit
  backend: hf_peft
  load_in_4bit: true
  attn_implementation: sdpa
  dtype: bfloat16
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  lora_on_vision: true           # rule 3 — asserted at runtime, not trusted
  lora_on_language: true
  max_seq_len: 1024
  image_max_pixels: 262144       # 512^2; Phase 2 measures this against native
  image_min_pixels: null
  gradient_checkpointing: true
